<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b20">
<title>TEGARIS82 — Panel</title>
<style>
:root{--cyan:#00d9ff;--blue:#246bff;--purple:#a100ff;--bg:#050916;--card:#0b1732;--line:#075d9d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#101c50 0,#050916 60%);color:#eef7ff;font-family:system-ui,Arial,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 45%,#00d9ff0b 50%,transparent 55%);background-size:240% 100%;animation:scan 7s linear infinite}
@keyframes scan{to{background-position:-240% 0}}@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #00cfff)}50%{filter:drop-shadow(0 0 15px #8a2bff)}}@keyframes float{50%{transform:translateY(-5px)}}
.wrap{width:min(460px,100%);margin:auto;padding:20px 16px 90px}.brand{text-align:center;padding:15px 0 20px}.logo{font-size:48px;animation:glow 3s infinite}.brand h1{margin:4px 0;color:var(--cyan);font-size:30px;letter-spacing:3px;text-shadow:0 0 18px #00cfff}.brand p{margin:4px;color:#9cb8dc;font-size:12px;letter-spacing:2px}
.panel{background:linear-gradient(145deg,#0d1c3b,#070e20);border:1px solid #0878ad;border-radius:20px;padding:20px;box-shadow:0 0 22px #006aff25;margin:12px 0}
h2{font-size:19px;margin:0 0 15px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#9dbbe0;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #155b9c;border-radius:11px;background:#040b1b;color:white;font-size:16px;outline:none}.field input:focus{border-color:var(--cyan);box-shadow:0 0 12px #00d9ff40}
.btn{width:100%;border:1px solid #00d9ff;background:linear-gradient(90deg,#086bda,#143cff,#7425dd);color:white;font-weight:800;letter-spacing:1px;padding:14px;border-radius:12px;font-size:16px;cursor:pointer;box-shadow:0 0 18px #006eff40}.btn:active{transform:scale(.99)}
.muted{color:#8ca5c8;font-size:12px;text-align:center}.hidden{display:none!important}.welcome{display:flex;align-items:center;gap:13px}.avatar{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:#071e4a;border:1px solid var(--cyan);font-size:28px;animation:float 3s ease-in-out infinite}.green{color:#52ffad}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:linear-gradient(145deg,#0c1d3d,#071022);border:1px solid #125c91;border-radius:16px;padding:18px 12px;cursor:pointer;text-align:left;color:white;min-height:112px}.tile .ico{font-size:28px;display:block;margin-bottom:12px}.tile strong{display:block;font-size:14px}.tile small{display:block;color:#91abd0;margin-top:5px}.tile:hover{border-color:var(--cyan);box-shadow:0 0 16px #00d9ff20}.section{margin-top:18px}.bar{position:fixed;bottom:0;left:0;right:0;background:#050b1af2;border-top:1px solid #124a79;display:flex;justify-content:center;gap:0;padding:8px max(10px,calc((100vw - 460px)/2));backdrop-filter:blur(10px)}.bar button{flex:1;background:none;border:0;color:#8da8d2;padding:8px 2px;cursor:pointer;font-size:12px}.bar button span{display:block;font-size:20px;margin-bottom:3px}.bar button.active{color:var(--cyan)}.notice{border:1px solid #125d80;background:#071b30;border-radius:12px;padding:12px;color:#b9d8f5;font-size:13px;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;margin:5px 0 18px}.top strong{color:var(--cyan);letter-spacing:2px}.back{border:0;background:none;color:#c5eaff;font-size:22px;cursor:pointer}.footer{text-align:center;color:#55769c;font-size:11px;margin-top:24px}
</style></head>
<body>
<div class="wrap">
<section id="login">
 <header class="brand"><div class="logo">♛</div><h1>TEGARIS82</h1><p>SECURE • FAST • FUTURISTIC</p></header>
 <div class="panel"><h2 style="text-align:center">LOGIN PANEL</h2>
  <form id="loginForm"><div class="field"><label>Username</label><input id="username" value="miss" autocomplete="username" required></div>
  <div class="field"><label>Password</label><input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required></div>
  <button class="btn" type="submit">➜ &nbsp; LOGIN</button></form>
  <p class="muted" id="loginMsg">Masuk ke dashboard TEGARIS82</p>
 </div><p class="muted">TEGARIS82 • Secure Access</p>
</section>
<section id="app" class="hidden">
 <div class="top"><button class="back" id="homeBtn" aria-label="Beranda">☰</button><strong>TEGARIS82</strong><span>🔔</span></div>
 <div class="panel welcome"><div class="avatar">♛</div><div><div>Selamat datang, <b id="userLabel">miss</b></div><small class="green">● Akses lokal aktif</small></div></div>
 <div class="panel" style="text-align:center;background:linear-gradient(120deg,#081b48,#1b0d46)"><div style="font-size:28px;color:#00d9ff;font-weight:900;letter-spacing:2px;animation:glow 3s infinite">TEGARIS82</div><div class="muted">PANEL • TOOLS • SECURITY</div></div>
 <div id="dashboard" class="grid">
  <button class="tile" data-page="security"><span class="ico">🛡️</span><strong>Security Check</strong><small>Panduan keamanan akun</small></button>
  <button class="tile" data-page="status"><span class="ico">📱</span><strong>Status WhatsApp</strong><small>Info dan pemeriksaan</small></button>
  <button class="tile" data-page="diagnostic"><span class="ico">🔎</span><strong>Diagnostik</strong><small>Checklist perangkat</small></button>
  <button class="tile" data-page="network"><span class="ico">📶</span><strong>Network Monitor</strong><small>Info koneksi lokal</small></button>
  <button class="tile" data-page="tips"><span class="ico">💬</span><strong>Balasan Cepat</strong><small>Template pesan sopan</small></button>
  <button class="tile" data-page="settings"><span class="ico">⚙️</span><strong>Pengaturan</strong><small>Tema dan sesi</small></button>
 </div>
 <section id="subpage" class="hidden section"><div class="top"><button class="back" id="backBtn">←</button><strong id="pageTitle">MENU</strong><span></span></div><div class="panel" id="pageContent"></div></section>
 <div class="footer">TEGARIS82 • Panel demo lokal</div>
</section>
</div>
<nav class="bar hidden" id="nav"><button class="active" data-nav="home"><span>⌂</span>Beranda</button><button data-nav="security"><span>♧</span>Keamanan</button><button data-nav="diagnostic"><span>⌁</span>Tools</button><button data-nav="settings"><span>⚙</span>Profil</button></nav>
<script>
const $=id=>document.getElementById(id);
$('loginForm').addEventListener('submit',e=>{e.preventDefault();if($('username').value.trim()==='miss'&&$('password').value==='miss1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('userLabel').textContent='miss';}else{$('loginMsg').textContent='Username atau password salah.';}});
const pages={
 security:['SECURITY CHECK','<h2>Checklist keamanan</h2><p>• Aktifkan verifikasi dua langkah di WhatsApp.</p><p>• Jangan bagikan kode OTP atau PIN.</p><p>• Periksa perangkat tertaut dan keluarkan sesi yang tidak dikenal.</p><p>• Perbarui aplikasi dari toko resmi.</p>'],
 status:['STATUS WHATSAPP','<h2>Pemeriksaan akun</h2><p>Gunakan WhatsApp resmi untuk melihat status koneksi dan perangkat tertaut.</p><div class="notice">Panel demo ini tidak terhubung ke server WhatsApp dan tidak mengubah akun atau status pengguna lain.</div>'],
 diagnostic:['DIAGNOSTIK','<h2>Checklist perangkat</h2><p>✓ Periksa ruang penyimpanan</p><p>✓ Pastikan aplikasi diperbarui</p><p>✓ Periksa izin aplikasi</p><p>✓ Coba jaringan Wi-Fi atau data seluler</p>'],
 network:['NETWORK MONITOR','<h2>Info koneksi</h2><p>Panel ini tidak membaca jaringan secara otomatis.</p><button class="btn" id="netBtn">Tampilkan panduan koneksi</button><div id="netResult" class="notice hidden">Buka Pengaturan perangkat → Jaringan & Internet untuk memeriksa koneksi.</div>'],
 tips:['BALASAN CEPAT','<h2>Template pesan</h2><p>Halo! Terima kasih sudah menghubungi kami. Kami akan segera membalas pesan Anda.</p><button class="btn" id="copyBtn">Salin template</button><p id="copyMsg" class="muted"></p>'],
 settings:['PENGATURAN','<h2>Pengaturan panel</h2><p>Username: <b>miss</b></p><p>Tema: Neon biru-ungu</p><button class="btn" id="logoutBtn">Keluar dari akun</button>']
};
function showPage(key){const p=pages[key];if(!p)return;$('dashboard').classList.add('hidden');$('subpage').classList.remove('hidden');$('pageTitle').textContent=p[0];$('pageContent').innerHTML=p[1];document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('active',b.dataset.nav===key));const net=$('netBtn');if(net)net.onclick=()=>$('netResult').classList.remove('hidden');const copy=$('copyBtn');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText('Halo! Terima kasih sudah menghubungi kami. Kami akan segera membalas pesan Anda.');$('copyMsg').textContent='Template disalin.';}catch(e){$('copyMsg').textContent='Silakan salin teks template secara manual.';}};const logout=$('logoutBtn');if(logout)logout.onclick=()=>{ $('app').classList.add('hidden');$('nav').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';};}
document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
$('backBtn').onclick=()=>{$('subpage').classList.add('hidden');$('dashboard').classList.remove('hidden');};
$('homeBtn').onclick=()=>{$('subpage').classList.add('hidden');$('dashboard').classList.remove('hidden');};
document.querySelectorAll('.bar button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='home'){$('subpage').classList.add('hidden');$('dashboard').classList.remove('hidden');document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('active',x===b));}else showPage(b.dataset.nav);}));
</script></body></html>
